# Reelmate licence service — Cloudflare Worker (free plan is enough).
# Deploy: npx wrangler deploy   (after: npx wrangler kv namespace create LICENCES → paste the id below)
name = "reel-studio-licence"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "LICENCES"
id = "PASTE_KV_NAMESPACE_ID"

# Release zips for automatic updates (free R2 bucket): npx wrangler r2 bucket create reel-releases
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "reel-releases"

[vars]
PRICE_ZAR = "1000.00"                # once-off price in rand (PayFast, South Africa)
PRICE_USD = "59.00"                  # once-off price in US dollars (PayPal, everywhere else) ≈ R1000
PRODUCT = "Reelmate"
PAYFAST_HOST = "www.payfast.co.za"   # sandbox: sandbox.payfast.co.za
PAYPAL_API = "api-m.paypal.com"      # sandbox: api-m.sandbox.paypal.com
PUBLIC_URL = "https://reelstudio.systemspilot.co.za"
MAX_MACHINES = "2"
# secrets (npx wrangler secret put NAME): PAYFAST_MERCHANT_ID, PAYFAST_MERCHANT_KEY, PAYFAST_PASSPHRASE,
#   PAYPAL_CLIENT_ID, PAYPAL_SECRET (PayPal developer dashboard → Apps → your live app), ADMIN_TOKEN
