[project]
name = "reel-studio-extension"
version = "1.8.0"
description = "Reel Studio by Systems Pilot — edits reels on your own computer, inside Claude or Codex"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mcp>=1.10,<2",
  "static-ffmpeg>=2.5",
  "pillow>=10",
  "resvg-py>=0.5",
  "numpy>=1.24",
  "faster-whisper>=1.0",
  "yt-dlp>=2024.1",
  "mediapipe>=0.10",
  "pycapcut>=0.0.3",
  "playwright>=1.40",
]

[tool.uv]
package = false
