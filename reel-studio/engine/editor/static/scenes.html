<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand-sp/favicon.png"><title>Scene effects · Reel Studio</title>
<style>
  @font-face { font-family: "Inter"; src: url("/fonts/Inter-Variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Poppins"; src: url("/fonts/Poppins-Bold.ttf"); font-weight: 700; }
  :root { --bg: #F3F5FB; --surface: #FFFFFF; --ink: #0E1638; --muted: #5F6889; --line: #E3E7F2; --soft: #EEF1F9;
          --accent: #2E5BFF; --accent-soft: #E8EEFF; --ok: #13865A; --r: 16px;
          --grad: linear-gradient(100deg, #18A9F5 0%, #3D5CFF 42%, #8A3BF0 75%, #E64BC8 100%); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14.5px/1.5 "Inter", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  h1, h2 { font-family: "Poppins", "Inter", sans-serif; letter-spacing: -.015em; margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 20px; } header small { color: var(--muted); }
  header .right { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header select { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .btn { border: 0; border-radius: 10px; padding: 9px 16px; background: var(--grad); color: #fff; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 22px; padding: 22px 24px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } main .lines { position: static; max-height: 45vh; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .lines { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; }
  .lines h2, .fx h2 { font-size: 16px; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  .ln { display: flex; gap: 10px; padding: 10px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; }
  .ln:hover { background: var(--soft); }
  .ln.on { border-color: var(--accent); background: var(--accent-soft); }
  .ln .n { flex: 0 0 26px; height: 26px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .ln .t { flex: 1; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; }
  .chip button { border: 0; background: rgba(255,255,255,.18); color: #fff; width: 18px; height: 18px; border-radius: 50%; cursor: pointer; line-height: 1; padding: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .e { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .e:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -16px rgba(14,22,56,.45); }
  .e .pic { aspect-ratio: 9/16; background: var(--soft) center/cover no-repeat; position: relative; }
  .e .pic span { position: absolute; inset: auto 0 0 0; padding: 6px; font-size: 11.5px; text-align: center; color: var(--muted); }
  .e .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .e .meta { padding: 10px 12px 12px; }
  .e b { display: block; font-size: 14px; }
  .e small { color: var(--muted); font-size: 12px; line-height: 1.35; display: block; margin-top: 2px; }
  .e.used { outline: 2px solid var(--ok); }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .bar label { display: flex; gap: 8px; align-items: center; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; display: none; z-index: 50; max-width: calc(100vw - 32px); }
  dialog { border: 0; border-radius: 18px; padding: 20px; max-width: min(420px, calc(100vw - 32px)); }
  dialog video { width: 100%; border-radius: 12px; background: #000; }
</style>
</head>
<body>
<header>
  <h1>Scene effects</h1><small>20 full-screen effects, played on your own video</small>
  <div class="right">
    <select id="proj" aria-label="Reel"></select>
    <button class="btn ghost" id="prevBtn">▶ Quick preview</button>
  </div>
</header>
<main>
  <section class="card lines">
    <h2>Your lines</h2>
    <p class="hint">Tap a line, then tap an effect to put it there. One effect per line.</p>
    <div id="lines"></div>
  </section>
  <section class="fx">
    <div class="bar">
      <label><input type="checkbox" id="series"> Show "N Video Effects" title + effect names at the top</label>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<dialog id="dlg"><h2 id="dlgT" style="font-size:17px;margin-bottom:10px">Quick preview</h2><div id="dlgB"></div>
  <p style="text-align:right;margin:12px 0 0"><button class="btn ghost" onclick="dlg.close()">Close</button></p></dialog>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
let slug = qs.get("p"), data = null, line = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 2600); }

function drawLines() {
  const label = Object.fromEntries(data.effects.map(e => [e.name, e.label]));
  $("#lines").innerHTML = data.lines.map(l => `<div class="ln ${l.id === line ? "on" : ""}" data-id="${l.id}">
      <div class="n">${l.id}</div><div class="t">${esc(l.text)}${l.fx.map(f => `<br><span class="chip">${esc(label[f] || f)}<button data-rm="${l.id}" aria-label="Remove">×</button></span>`).join("")}</div></div>`).join("")
    || `<p class="hint">This reel has no spoken lines yet — ask Claude to make the rough cut first.</p>`;
  document.querySelectorAll(".ln").forEach(el => el.onclick = e => {
    if (e.target.dataset.rm) return setFx(+e.target.dataset.rm, "");
    line = +el.dataset.id; drawLines();
  });
  const used = new Set(data.lines.flatMap(l => l.fx));
  document.querySelectorAll(".e").forEach(el => el.classList.toggle("used", used.has(el.dataset.fx)));
}

function drawGrid() {
  $("#grid").innerHTML = data.effects.map(e => `<div class="e" data-fx="${e.name}" tabindex="0">
      <div class="pic" data-fx="${e.name}"><span>${data.has_video ? "Loading preview…" : ""}</span></div>
      <div class="meta"><b>${esc(e.label)}</b><small>${esc(e.about)}</small></div></div>`).join("");
  document.querySelectorAll(".e").forEach(el => {
    el.onclick = () => line == null ? toast("First tap the line where it should go") : setFx(line, el.dataset.fx);
    el.onkeydown = ev => { if (ev.key === "Enter") el.click(); };
  });
  if (!data.has_video) return;
  // previews are made on this reel's own footage, one at a time, as the cards come into view
  const queue = [], seen = new Set();
  let busy = false;
  const next = () => {
    if (busy || !queue.length) return;
    busy = true;
    const pic = queue.shift(), img = new Image();
    img.onload = img.onerror = () => { pic.innerHTML = ""; if (img.naturalWidth) pic.appendChild(img); else pic.innerHTML = "<span>No preview</span>"; busy = false; next(); };
    img.src = `/api/p/${slug}/scene-clip?fx=${pic.dataset.fx}`;
  };
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting && !seen.has(e.target)) { seen.add(e.target); queue.push(e.target); next(); }
  }), { rootMargin: "200px" });
  document.querySelectorAll(".pic").forEach(p => io.observe(p));
}

async function setFx(id, fx) {
  toast(fx ? "Adding…" : "Removing…");
  try {
    data = Object.assign(data, await api(`/api/p/${slug}/scene-set`, { line: id, fx }));
    drawLines();
    toast(fx ? `Added to line ${id} ✓ — tap Quick preview to watch` : "Removed ✓");
  } catch (e) { toast("Couldn't change that: " + e.message); }
}

$("#series").onchange = async e => {
  try { data = Object.assign(data, await api(`/api/p/${slug}/scene-set`, { line: 0, fx: "", series: e.target.checked })); toast(e.target.checked ? "Series title on ✓" : "Series title off"); }
  catch (err) { toast("Couldn't change that: " + err.message); }
};

$("#prevBtn").onclick = async () => {
  await api(`/api/p/${slug}/render`, { preview: true });
  $("#dlgT").textContent = "Quick preview rendering…";
  $("#dlgB").innerHTML = `<p class="hint">This runs on your computer and doesn't use Claude credits.</p>`;
  $("#dlg").showModal();
  const poll = setInterval(async () => {
    const j = await api(`/api/p/${slug}/job`);
    if (j.state === "done") { clearInterval(poll); $("#dlgT").textContent = "Done ✓"; $("#dlgB").innerHTML = `<video controls autoplay playsinline src="/api/p/${slug}/render/${j.file}?v=${Date.now()}"></video>`; }
    else if (j.state === "error") { clearInterval(poll); $("#dlgT").textContent = "Something went wrong"; $("#dlgB").textContent = j.error + " — tell Claude \"the render failed\" and it will fix it."; }
  }, 1500);
};

async function init() {
  const projs = await api("/api/projects");
  const list = projs.map(p => typeof p === "string" ? p : p.slug);
  if (!slug) slug = list[0];
  $("#proj").innerHTML = list.map(s => `<option ${s === slug ? "selected" : ""}>${esc(s)}</option>`).join("");
  $("#proj").onchange = e => location.search = "?p=" + encodeURIComponent(e.target.value);
  if (!slug) { $("#lines").innerHTML = `<p class="hint">No reels yet — start one in the Studio.</p>`; return; }
  data = await api(`/api/p/${slug}/scenes`);
  $("#series").checked = !!data.series;
  drawGrid(); drawLines();
}
init().catch(e => toast("Error: " + e.message));
</script>
<script src="/chat.js"></script>
</body>
</html>
