<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand-sp/reelmate-favicon.png"><title>Sound & finish · Reelmate</title>
<style>
  :root { --bg: #FDF6EB; --surface: #FFFDF8; --ink: #17392B; --muted: #5E6B63; --line: #EADFCD; --soft: #F6EEE1; --r: 18px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; } header small { color: var(--muted); }
  header .right { margin-left: auto; }
  main { max-width: 980px; margin: 0 auto; padding: 22px 24px 60px; display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card p.sub { margin: 0 0 12px; color: var(--muted); }
  .choice { display: flex; gap: 12px; align-items: flex-start; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 8px 0; cursor: pointer; background: #fff; }
  .choice input { margin-top: 4px; accent-color: #E8541E; }
  .choice b { display: block; } .choice span { color: var(--muted); font-size: 13.5px; }
  .choice:has(input:checked) { border-color: #E8541E; background: #FFF3EA; }
  .rowx { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .btn { border: 0; border-radius: 999px; padding: 12px 22px; background: #E8541E; color: #fff; font-weight: 800; cursor: pointer; font-size: 16px; text-decoration: none; display: inline-block; }
  .btn.ghost { background: #fff; color: var(--ink); border: 2px solid #104631; padding: 9px 18px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .player video { width: 100%; border-radius: 18px; background: #000; aspect-ratio: 9/16; }
  .player .empty { aspect-ratio: 9/16; border-radius: 18px; background: var(--soft); display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; }
  .dl { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .msg { color: var(--muted); margin-top: 10px; min-height: 1.4em; }
  .bar { height: 8px; background: var(--soft); border-radius: 9px; overflow: hidden; margin-top: 10px; display: none; }
  .bar i { display: block; height: 100%; width: 30%; background: #E8541E; border-radius: 9px; animation: go 1.4s ease-in-out infinite; }
  @keyframes go { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 16px; } }
</style>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js" defer></script>
</head>
<body>
<header><div><h1>Sound &amp; finish</h1><small id="proj"></small></div><div class="right"><a class="btn ghost" href="/">Studio</a></div></header>
<main>
  <div>
    <section class="card">
      <h2>Sound effects</h2>
      <p class="sub">No whooshes or game sounds. Ever.</p>
      <label class="choice"><input type="radio" name="sfx" value="quiet"><div><b>None (recommended)</b><span>Just your voice and music. Clean and calm.</span></div></label>
      <label class="choice"><input type="radio" name="sfx" value="soft"><div><b>A few soft sounds</b><span>A gentle paper or pop sound on the big moments only. Your own sounds first.</span></div></label>
    </section>
    <section class="card">
      <h2>Music</h2>
      <p class="sub">The best-sounding reels use a real song.</p>
      <label class="choice"><input type="radio" name="music" value="trending"><div><b>A trending sound (best)</b><span>No music in the file. When you post, pick a trending sound in Instagram or TikTok.</span></div></label>
      <label class="choice"><input type="radio" name="music" value="mine"><div><b>My own song</b><span>An mp3 you made (Suno) or have the rights to (Epidemic Sound, Artlist…).
        <label class="btn ghost" style="margin-top:8px;display:inline-block;cursor:pointer">Choose a song<input type="file" id="song" accept="audio/*" hidden></label></span></div></label>
      <label class="choice"><input type="radio" name="music" value="builtin"><div><b>Calm built-in music</b><span>Made by Reelmate, free. Fine as a backup.</span></div></label>
      <div class="rowx">Music volume <input type="range" id="gain" min="0.1" max="1" step="0.05" style="flex:1"></div>
    </section>
  </div>
  <aside>
    <section class="card player">
      <h2>Your reel</h2>
      <div id="pv"><div class="empty">Press <b>Make my reel</b>. It shows up here to watch and download.</div></div>
      <div class="bar" id="bar"><i></i></div>
      <p class="msg" id="msg"></p>
      <button class="btn" id="go" style="width:100%">Make my reel</button>
      <div class="dl" id="dl"></div>
    </section>
  </aside>
</main>
<script>
const slug = new URLSearchParams(location.search).get("p") || "";
const $ = id => document.getElementById(id);
$("proj").textContent = slug;
const post = (u, b) => fetch(u, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)}).then(r => r.json());
let S = {};
async function load() {
  S = await (await fetch(`/api/p/${slug}/sound`)).json();
  document.querySelector(`input[name=sfx][value=${S.sound === "soft" ? "soft" : "quiet"}]`).checked = true;
  document.querySelector(`input[name=music][value=${S.music}]`).checked = true;
  $("gain").value = S.gain || 0.6;
  show();
  if (S.job && S.job.state === "rendering") wait();
}
function show() {
  const t = Date.now();
  if (S.files.includes("final.mp4")) {
    $("pv").innerHTML = `<video controls playsinline src="/api/p/${slug}/render/final.mp4?v=${t}" poster="/api/p/${slug}/render/cover.jpg?v=${t}"></video>`;
    $("dl").innerHTML = `<a class="btn ghost" download href="/api/p/${slug}/render/final.mp4">Download the reel</a>`
      + (S.files.includes("final-for-trending-sound.mp4") ? `<a class="btn ghost" download href="/api/p/${slug}/render/final-for-trending-sound.mp4">Download without music (for a trending sound)</a>` : "")
      + (S.files.includes("cover.jpg") ? `<a class="btn ghost" download href="/api/p/${slug}/render/cover.jpg">Download the cover</a>` : "");
    $("go").textContent = "Make it again";
  }
}
async function save() {
  const sfx = document.querySelector("input[name=sfx]:checked").value;
  const music = document.querySelector("input[name=music]:checked").value;
  await post(`/api/p/${slug}/sound`, {sound: sfx, music, gain: +$("gain").value});
  $("msg").textContent = "Saved. Press Make my reel to hear it.";
}
document.querySelectorAll("input[name=sfx], input[name=music]").forEach(i => i.onchange = save);
$("gain").onchange = save;
$("song").onchange = async () => {
  const f = $("song").files[0]; if (!f) return;
  $("msg").textContent = "Adding your song…";
  const r = await (await fetch(`/api/p/${slug}/music-upload?name=${encodeURIComponent(f.name)}`, {method: "POST", body: f})).json();
  if (r.ok) { document.querySelector("input[name=music][value=mine]").checked = true; $("msg").textContent = `"${f.name}" is in. Press Make my reel.`; }
  else $("msg").textContent = r.error;
};
function wait() {
  $("go").disabled = true; $("bar").style.display = "block";
  $("msg").textContent = "Making your reel… a few minutes. You can leave this page open.";
  const poll = async () => {
    const j = (await (await fetch(`/api/p/${slug}/sound`)).json());
    S = j;
    if (j.job.state === "rendering") return setTimeout(poll, 3000);
    $("go").disabled = false; $("bar").style.display = "none";
    $("msg").textContent = j.job.state === "done" ? "Done! Watch it, then download." : (j.job.error || "That didn't work.");
    show();
  };
  setTimeout(poll, 2500);
}
$("go").onclick = async () => { await save(); await post(`/api/p/${slug}/render`, {}); wait(); };
load();
</script>
<script src="/chat.js"></script>
<script>setTimeout(() => { const c = document.getElementById("rs-chat"); if (c) c.classList.add("rs-min"); }, 400);   // folded: it sits over the downloads</script>
</body>
</html>
