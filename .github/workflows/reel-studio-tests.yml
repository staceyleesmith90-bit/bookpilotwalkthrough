name: Reel Studio tests (Windows · Mac · Linux)
on:
  push:
    paths: ["reel-studio/**", ".github/workflows/reel-studio-tests.yml"]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: reel-studio
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reel-studio/requirements.txt
      - name: ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Setup check
        run: python -m engine setup-check
      - name: Tests
        run: python -m pytest tests -q
      - name: Licence service tests
        run: node licence-service/test.mjs
      - uses: astral-sh/setup-uv@v6
      - name: One-click extension (build, install like Claude does, call its tools)
        shell: bash
        run: |
          python scripts/build_extension.py
          mkdir -p "$RUNNER_TEMP/ext/ext"
          (cd "$RUNNER_TEMP/ext/ext" && unzip -q "$GITHUB_WORKSPACE"/reel-studio/dist/reel-studio-*.mcpb)
          uv --directory "$RUNNER_TEMP/ext/ext" run python "$GITHUB_WORKSPACE/reel-studio/extension/tests/smoke.py" "$RUNNER_TEMP/ext" DEV
